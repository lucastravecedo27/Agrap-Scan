<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agrap Scan · Oficina</title>
  <meta name="description" content="Oficina de Agrap Scan (para computador): fincas, catálogo, productos nuevos y libro de códigos QR.">
  <meta name="theme-color" content="#00283f">
  <link rel="icon" href="iconos/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/impresion.css" media="print">
  <script src="lib/qrcode.js" defer></script>
</head>
<body data-modo="oficina">
  <header class="cabecera">
    <div class="cabecera-bodega cabecera-oficina">
      <span>Agrap Scan · Oficina</span>
      <small>Catálogo de todas las fincas · se envía a cada teléfono</small>
    </div>
    <a class="btn btn-claro btn-simulador" href="simulador.html" target="_blank" rel="noopener">🖥 Probar la finca en el PC</a>
    <span class="version version-app"></span>
  </header>
  <div id="bandaPendientes" hidden></div>
  <nav class="pestanas pestanas-2" aria-label="Secciones">
    <button type="button" class="pestana" data-ir="catalogo"><span aria-hidden="true">☰</span>Catálogo y productos</button>
    <button type="button" class="pestana" data-ir="libro"><span aria-hidden="true">▤</span>Libro de QR</button>
  </nav>
  <main>
    <section class="pantalla" data-pantalla="catalogo" hidden></section>
    <section class="pantalla" data-pantalla="libro" hidden></section>
  </main>
  <noscript>Esta página necesita JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
